name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarQube uses git history to assign new code to authors and dates.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first: the router plugin generates src/routeTree.gen.ts, which
      # typecheck and lint both need to exist.
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm test:coverage

      # The scan runs in this job, not a separate one: it needs coverage/lcov.info
      # from the step above, and jobs do not share a workspace.
      - name: Check for SONAR_TOKEN
        id: sonar_guard
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: echo "configured=${SONAR_TOKEN:+yes}" >> "$GITHUB_OUTPUT"

      - name: SonarQube scan
        if: steps.sonar_guard.outputs.configured == 'yes'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Warn when SonarQube is not configured
        if: steps.sonar_guard.outputs.configured != 'yes'
        run: |
          echo "::warning title=SonarQube not configured::SONAR_TOKEN is not set, so no analysis ran. The handbook requires SonarQube Cloud on open source projects."

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The client's backend team deploys this image at handover. Building it on
      # every PR is what stops it rotting between now and then.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: agora-paraguay:ci
