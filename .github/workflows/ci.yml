name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first: the router plugin generates src/routeTree.gen.ts, which
      # typecheck and lint both need to exist.
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm test

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The client's backend team deploys this image at handover. Building it on
      # every PR is what stops it rotting between now and then.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: agora-paraguay:ci

  sonarqube:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for SONAR_TOKEN
        id: guard
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: echo "configured=${SONAR_TOKEN:+yes}" >> "$GITHUB_OUTPUT"

      - name: SonarQube scan
        if: steps.guard.outputs.configured == 'yes'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
