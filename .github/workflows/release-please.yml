name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Keeps a release PR open that accumulates conventional commits, bumps the
      # version in package.json, and writes CHANGELOG.md. Merging it tags a release.
      # This app is not published to npm, so there is no publish step.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
